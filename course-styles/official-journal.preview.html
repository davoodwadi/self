<!doctype html><html><head><title>Official Journal style preview</title><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Public+Sans:wght@400;600&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@400;600&family=Zilla+Slab:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#ddd;font-family:sans-serif}#root{display:grid;gap:22px;padding:20px;max-width:760px;margin:auto}.lb{font-size:13px;color:#555;margin:0 0 6px}.sl{border-radius:12px;padding:22px 24px 18px}.nt{font-size:12px;color:#555;margin:6px 0 0;line-height:1.5}.tx{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:10px 0 14px}</style></head><body><div id="root"></div>
<script>
const C=[255,337,419,501,583];
const S1="Unlike a human employee who makes one decision at a time, a deployed model executes <b>thousands of decisions per second</b> using the same decision rule.";
const S2a="An error, bias, or perverse incentive in that rule therefore ",S2b="scales immediately across an entire market segment",S2c=".";
const T=(x,y,s,f,sz,fill,o='')=>`<text x="${x}" y="${y}" font-family="${f}" font-size="${sz}" fill="${fill}" text-anchor="middle" ${o}>${s}</text>`;
const P={};

/* 1 Official Journal: engraving + violet official ink */
P.journal=()=>{const k='#1A1714',v='#5B3A8C',F="IM Fell English";
let s=`<defs>
<pattern id="jL" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="${k}" stroke-width=".55"/></pattern>
<pattern id="jM" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="3" stroke="${k}" stroke-width=".6"/></pattern>
<pattern id="jD" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V3M0 0H3" stroke="${k}" stroke-width=".7"/></pattern></defs>`;
s+=T(95,26,'One decision at a time',F,14,'#4A443C','font-style="italic"');
s+=`<ellipse cx="95" cy="57" rx="12" ry="9" fill="url(#jM)" stroke="${k}"/><path d="M89 65C92 73 92 81 87 90H103C98 81 98 73 101 65Z" fill="url(#jL)" stroke="${k}"/><rect x="72" y="90" width="46" height="14" fill="url(#jD)" stroke="${k}"/><rect x="74" y="104" width="42" height="3" fill="${k}"/><line x1="95" y1="111" x2="95" y2="127" stroke="${k}" stroke-width=".7" stroke-dasharray="1 3"/>`;
s+=`<path d="M57 130H125L133 138V174H57Z" fill="#fff" stroke="${k}"/><path d="M125 130V138H133" fill="none" stroke="${k}" stroke-width=".7"/>`+[142,149,156,163].map((y,i)=>`<line x1="65" y1="${y}" x2="${i%2?112:122}" y2="${y}" stroke="${k}" stroke-width=".6"/>`).join('');
s+=`<line x1="183" y1="16" x2="183" y2="192" stroke="${k}" stroke-width=".6"/><line x1="187" y1="16" x2="187" y2="192" stroke="${k}" stroke-width=".6"/><circle cx="185" cy="104" r="2" fill="${k}"/>`;
s+=T(420,26,'Thousands of decisions per second',F,14,'#4A443C','font-style="italic"');
s+=`<rect x="215" y="44" width="410" height="34" fill="url(#jM)" stroke="${k}"/><rect x="328" y="49" width="184" height="24" fill="#fff" stroke="${k}"/><rect x="331" y="52" width="178" height="18" fill="none" stroke="${k}" stroke-width=".5"/>`+T(420,66,'Same decision rule',"IM Fell English SC",14,k);
C.forEach((c,i)=>{const d=i<4;s+=`<line x1="${c}" y1="78" x2="${c}" y2="104" stroke="${k}" stroke-width="1.3"/><rect x="${c-18}" y="104" width="36" height="9" fill="url(#jD)" stroke="${k}"/>
<path d="M${c-36} 130H${c+28}L${c+36} 138V174H${c-36}Z" fill="#fff" stroke="${k}"/><path d="M${c+28} 130V138H${c+36}" fill="none" stroke="${k}" stroke-width=".7"/>`+[140,146,152].map((y,j)=>`<line x1="${c-29}" y1="${y}" x2="${c+(j%2?14:22)}" y2="${y}" stroke="${k}" stroke-width=".6"/>`).join('')+
`<g transform="rotate(-8 ${c} 161)"><rect x="${c-27}" y="151" width="54" height="20" rx="3" fill="#fff" fill-opacity=".85" stroke="${d?v:k}" stroke-width="1.6"/><rect x="${c-24}" y="154" width="48" height="14" rx="1.5" fill="none" stroke="${d?v:k}" stroke-width=".6"/>`+T(c,165,d?'Denied':'Granted',"IM Fell English SC",12,d?v:k)+`</g>`});
return `<svg viewBox="0 0 640 196" width="100%" role="img" aria-label="Engraved hand stamp over one ruled sheet; an engraved beam bearing the same decision rule presses five sheets, four marked with a violet DENIED seal and one GRANTED"><title>One decision at a time versus one rule sealed on many sheets</title>${s}</svg>`};

/* 2 Technical standard: DIN + ISO pictograms */
P.standard=()=>{const k='#1B1B1B',r='#C1272D',g='#00804A',F="Barlow Condensed";let s='';
s+=T(95,24,'ONE DECISION AT A TIME',F,13,k,'font-weight="600" letter-spacing="1.2"');
s+=`<g stroke="${k}" stroke-linecap="round" stroke-linejoin="round" fill="none"><line x1="22" y1="160" x2="158" y2="160" stroke-width="5"/><line x1="40" y1="78" x2="40" y2="118" stroke-width="11"/><path d="M36 118L33 156M44 118L50 156" stroke-width="8"/><path d="M45 84L66 100L108 88" stroke-width="7"/></g><circle cx="40" cy="58" r="9" fill="${k}"/><rect x="111" y="76" width="8" height="18" rx="2" fill="${k}"/><rect x="103" y="94" width="24" height="9" rx="2" fill="${k}"/>
<path d="M98 120h26l8 8v30h-34z" fill="#fff" stroke="${k}" stroke-width="4" stroke-linejoin="round"/><line x1="104" y1="136" x2="124" y2="136" stroke="${k}" stroke-width="3.5" stroke-linecap="round"/><line x1="104" y1="146" x2="118" y2="146" stroke="${k}" stroke-width="3.5" stroke-linecap="round"/>`;
s+=`<rect x="183" y="16" width="3" height="176" fill="${k}"/>`;
s+=T(420,24,'THOUSANDS OF DECISIONS PER SECOND',F,13,k,'font-weight="600" letter-spacing="1.2"');
s+=`<rect x="215" y="40" width="410" height="36" rx="6" fill="${k}"/>`+T(420,64,'SAME DECISION RULE',F,16,'#fff','font-weight="600" letter-spacing="2.5"');
C.forEach((c,i)=>{const d=i<4;s+=`<line x1="${c}" y1="76" x2="${c}" y2="98" stroke="${k}" stroke-width="6"/><rect x="${c-15}" y="98" width="30" height="9" rx="2" fill="${k}"/>
<path d="M${c-22} 120h28l8 8v40h-36z" fill="#fff" stroke="${k}" stroke-width="4" stroke-linejoin="round"/><line x1="${c-15}" y1="136" x2="${c+6}" y2="136" stroke="${k}" stroke-width="3.5" stroke-linecap="round"/><line x1="${c-15}" y1="146" x2="${c}" y2="146" stroke="${k}" stroke-width="3.5" stroke-linecap="round"/>`+
(d?`<circle cx="${c+16}" cy="164" r="14" fill="#fff" stroke="${r}" stroke-width="5"/><line x1="${c+6.5}" y1="154.5" x2="${c+25.5}" y2="173.5" stroke="${r}" stroke-width="5"/>`
:`<rect x="${c+2}" y="150" width="28" height="28" rx="3" fill="${g}"/><path d="M${c+9} 164l5 6 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`)});
return `<svg viewBox="0 0 640 196" width="100%" role="img" aria-label="Standard pictograms: a person at a desk stamps one document; a decision-rule machine stamps five documents, four marked with a red prohibition sign and one with a green safe-condition check"><title>One person decides once; one rule decides many</title>${s}</svg>`};

/* 3 Patent drawing: line + stipple */
P.patent=()=>{const k='#141414',r='#B8321F',F="Libre Caslon Text";
let s=`<defs><pattern id="pD" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".55" fill="${k}"/><circle cx="2.5" cy="2.4" r=".45" fill="${k}"/></pattern>
<pattern id="pL" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".5" fill="${k}"/><circle cx="3.6" cy="3.2" r=".4" fill="${k}"/></pattern>
<pattern id="pR" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="${r}"/><circle cx="2.5" cy="2.4" r=".5" fill="${r}"/></pattern></defs>`;
const box=(x,y,w,h,dx,dy,side='pD',top='pL',topFill)=>`<path d="M${x} ${y}L${x+dx} ${y-dy}H${x+w+dx}L${x+w} ${y}Z" fill="${topFill||`url(#${top})`}" stroke="${k}" stroke-width=".9"/><path d="M${x+w} ${y}L${x+w+dx} ${y-dy}V${y+h-dy}L${x+w} ${y+h}Z" fill="url(#${side})" stroke="${k}" stroke-width=".9"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff" stroke="${k}" stroke-width=".9"/>`;
s+=`<ellipse cx="97" cy="54" rx="11" ry="5" fill="#fff" stroke="${k}" stroke-width=".9"/><path d="M86 54C86 61 108 61 108 54V58C108 65 86 65 86 58Z" fill="url(#pL)" stroke="${k}" stroke-width=".9"/><path d="M93 62V84H101V62" fill="#fff" stroke="${k}" stroke-width=".9"/><path d="M99 62V84H101V62Z" fill="url(#pD)"/>`+box(72,88,42,12,8,6)+`<line x1="97" y1="104" x2="97" y2="124" stroke="${k}" stroke-width=".7" stroke-dasharray="6 2 1 2"/>`;
s+=`<path d="M52 150L70 128H146L128 150Z" fill="#fff" stroke="${k}" stroke-width=".9"/><path d="M52 150V154H128L146 132V128L128 150Z" fill="url(#pD)" stroke="${k}" stroke-width=".9"/>`+[0,1,2].map(i=>`<line x1="${66+i*-3.3}" y1="${136+i*4}" x2="${120+i*-3.3}" y2="${136+i*4}" stroke="${k}" stroke-width=".6"/>`).join('');
s+=T(97,186,'FIG. 1: one decision at a time',F,11,k,'font-style="italic"');
s+=`<line x1="186" y1="20" x2="186" y2="168" stroke="${k}" stroke-width=".5" stroke-dasharray="14 3 2 3"/>`;
s+=box(215,50,392,26,12,8)+T(411,68,'SAME DECISION RULE',F,11,k,'letter-spacing="2.5"');
C.forEach((c,i)=>{const d=i<4,x=c-4;s+=`<line x1="${x}" y1="76" x2="${x}" y2="104" stroke="${k}" stroke-width="1"/><line x1="${x+3}" y1="76" x2="${x+3}" y2="104" stroke="${k}" stroke-width="1"/>`+box(x-15,104,30,7,5,3)+
`<path d="M${c-40} 160L${c-24} 138H${c+36}L${c+20} 160Z" fill="${d?'url(#pR)':'#fff'}" stroke="${d?r:k}" stroke-width="${d?1.3:.9}"/><path d="M${c-40} 160V163H${c+20}L${c+36} 141V138L${c+20} 160Z" fill="url(#pD)" stroke="${k}" stroke-width=".9"/>`+(d?'':[0,1].map(j=>`<line x1="${c-24-j*3}" y1="${145+j*5}" x2="${c+22-j*3}" y2="${145+j*5}" stroke="${k}" stroke-width=".6"/>`).join(''))});
s+=T(420,186,'FIG. 2: thousands of decisions per second',F,12,k,'font-style="italic"');
return `<svg viewBox="0 0 640 196" width="100%" role="img" aria-label="Patent drawing: stippled hand stamp over one card (fig. 1); a stippled rule bar drives five plungers onto five cards, four stippled red and one plain (fig. 2)"><title>One decision at a time versus one rule pressing many cards</title>${s}</svg>`};

/* 4 Woodcut civic print */
P.woodcut=()=>{const k='#141210',r='#A3162B',F="Zilla Slab",p='#F5F4F0';
let s=`<defs><filter id="wr" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
<pattern id="wg" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><path d="M0 4.5Q2 3.6 5 4.5" stroke="${p}" stroke-width="1.3" fill="none" stroke-linecap="round"/></pattern></defs><g filter="url(#wr)">`;
s+=T(95,24,'ONE DECISION AT A TIME',F,12,k,'font-weight="700" letter-spacing="1"');
s+=`<ellipse cx="95" cy="56" rx="13" ry="10" fill="${k}"/><path d="M88 52Q93 48 99 50" stroke="${p}" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M89 65C92 73 92 81 87 90H103C98 81 98 73 101 65Z" fill="${k}"/><rect x="70" y="90" width="50" height="16" fill="${k}"/><rect x="70" y="90" width="50" height="16" fill="url(#wg)"/><line x1="95" y1="111" x2="95" y2="126" stroke="${k}" stroke-width="2" stroke-dasharray="3 4"/>`;
s+=`<rect x="56" y="130" width="78" height="44" fill="${p}" stroke="${k}" stroke-width="3.5"/><path d="M64 141H122M64 150H112M64 159H120" stroke="${k}" stroke-width="2.4"/>`;
s+=`<path d="M183 16L188 16L186 192L184 192Z" fill="${k}"/>`;
s+=T(420,24,'THOUSANDS OF DECISIONS PER SECOND',F,12,k,'font-weight="700" letter-spacing="1"');
s+=`<rect x="213" y="40" width="414" height="38" fill="${k}"/><path d="M222 45Q300 43 380 45M460 45Q540 43 618 45" stroke="${p}" stroke-width="1.4" fill="none"/>`+T(420,65,'SAME DECISION RULE',F,16,p,'font-weight="700" letter-spacing="2.5"');
C.forEach((c,i)=>{const d=i<4;s+=`<rect x="${c-3}" y="78" width="6" height="26" fill="${k}"/><rect x="${c-19}" y="104" width="38" height="11" fill="${k}"/>
<rect x="${c-36}" y="130" width="72" height="44" fill="${d?r:p}" stroke="${k}" stroke-width="3.5"/>`+(d?`<rect x="${c-34}" y="132" width="68" height="40" fill="url(#wg)"/>`:`<path d="M${c-28} 141H${c+26}M${c-28} 150H${c+16}M${c-28} 159H${c+24}" stroke="${k}" stroke-width="2.4"/>`)});
s+=`</g>`;
return `<svg viewBox="0 0 640 196" width="100%" role="img" aria-label="Woodcut print: a carved hand stamp over one card; a black rule beam presses five cards, four cut in carmine and one plain"><title>One decision at a time versus one rule printed on many cards</title>${s}</svg>`};

const D=[
{k:'journal',n:'1. Official Journal: statute, re-inked',bg:'background:#FFFFFF;color:#1A1714',ey:['IM Fell English SC',13,'#4A443C','Art. 1. Section 2'],h:['IM Fell English',400,30,'#1A1714'],b:['Public Sans',14,'#2A2620'],acc:'#5B3A8C',margin:true,note:'Old legal-print serif (IM Fell) with Public Sans, a typeface made for government; numbered clauses in the margin; copper-engraving hatching; violet official-stamp ink instead of the research course\'s blue.'}];
const R=document.getElementById('root');
D.forEach(d=>{const ey=d.box?`<span style="font-family:'${d.ey[0]}';font-weight:600;font-size:${d.ey[1]}px;letter-spacing:.12em;border:2px solid #1B1B1B;padding:1px 8px">${d.ey[3]}</span>`:`<div style="font-family:'${d.ey[0]}';font-size:${d.ey[1]}px;letter-spacing:.08em;color:${d.ey[2]}">${d.ey[3]}</div>`;
const h=`<div style="font-family:'${d.h[0]}';font-weight:${d.h[1]};font-size:${d.h[2]}px;line-height:1.1;margin:8px 0 0;color:${d.h[3]}${d.k==='standard'?';text-transform:uppercase;letter-spacing:.01em':''}">Why market algorithms require governance</div>`;
const bs=`font-family:'${d.b[0]}';font-size:${d.b[1]}px;line-height:1.55;color:${d.b[2]};margin:0`;
const mg=n=>d.margin?`<span style="font-family:'IM Fell English';color:#8A8378;margin-right:6px">(${n})</span>`:'';
const el=document.createElement('div');
el.innerHTML=`<p class="lb">${d.n}</p><div class="sl" style="${d.bg}">${ey}${h}${d.k==='journal'?'<div style="border-top:3px double #1A1714;margin-top:10px"></div>':''}<div class="tx"><p style="${bs}">${mg(1)}${S1}</p><p style="${bs}">${mg(2)}${S2a}<b style="color:${d.acc}">${S2b}</b>${S2c}</p></div>${P[d.k]()}</div><p class="nt">${d.note}</p>`;
R.appendChild(el)});
</script></body></html>
